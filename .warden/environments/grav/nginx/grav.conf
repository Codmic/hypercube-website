# Grav vhost for warden, included by /etc/nginx/conf.d/default.conf via
# NGINX_TEMPLATE=grav.conf (see .warden/environments/grav/grav.base.yml).
# Adapted from src/webserver-configs/nginx.conf for the warden php-fpm upstream.

# deny direct access to dotfiles (.env, .git, .htaccess, ...), except .well-known
location ~* /\.(?!well-known).* { return 403; }

## Begin - Security
# deny all direct access for these folders
location ~* ^/(cache|bin|logs|backup|tests)/.*$ { return 403; }
# deny all direct access to these sensitive user folders, whatever the file type
location ~* ^/user/(config|env)/.*$ { return 403; }
# allow avatar images under user/accounts to be served directly (SVG excluded
# as a stored-XSS vector); must precede the user/accounts deny below
location ~* ^/user/accounts/[^/]+/[^/]+\.(jpe?g|png|gif|webp|avif|bmp|ico)$ { try_files $uri =404; }
# deny everything else under user/accounts, whatever the file type
location ~* ^/user/accounts/.*$ { return 403; }
# allow public media uploads under user/data to be served directly (SVG
# excluded); must precede the user/data deny below
location ~* ^/user/data/.*\.(jpe?g|png|gif|webp|avif|bmp|ico|mp4|webm|ogg|ogv|mov|mp3|wav|m4a|flac|pdf)$ { try_files $uri =404; }
# deny everything else under user/data, whatever the file type
location ~* ^/user/data/.*$ { return 403; }
# deny running scripts inside core system folders
location ~* ^/(system|vendor)/.*\.(txt|xml|md|html|htm|shtml|shtm|json|yaml|yml|php|php2|php3|php4|php5|phar|phtml|pl|py|cgi|twig|sh|bat)$ { return 403; }
# deny running scripts inside user folder
location ~* ^/user/.*\.(txt|md|json|yaml|yml|php|php2|php3|php4|php5|phar|phtml|pl|py|cgi|twig|sh|bat)$ { return 403; }
# deny access to specific files in the root folder
location ~ ^/(LICENSE\.txt|composer\.lock|composer\.json|nginx\.conf|web\.config|htaccess\.txt) { return 403; }
## End - Security

## Begin - Static asset caching
# MUST stay below the security block above (see reasoning there): nginx picks
# the first matching regex location, so a caching rule placed earlier would
# answer for paths the denies above are meant to refuse.
location ~* /_app/immutable/.*\.(js|css|woff2?)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ~* \.(jpe?g|png|gif|webp|avif|bmp|ico|svg|mp4|webm|ogg|ogv|mov|mp3|wav|m4a|flac|css|js|woff2?|ttf|otf|eot)$ {
    try_files $uri $uri/ /index.php$is_args$query_string;
    expires 30d;
    access_log off;
}
## End - Static asset caching

location / {
    try_files $uri $uri/ /index.php$is_args$query_string;
}

location ~ \.php$ {
    try_files $uri =404;
    expires off;

    fastcgi_pass $fastcgi_backend;

    fastcgi_buffers 1024 4k;
    fastcgi_buffer_size 32k;
    fastcgi_busy_buffers_size 256k;
    fastcgi_read_timeout 600s;

    include fastcgi_params;

    fastcgi_param HTTPS on;
    fastcgi_param SCRIPT_FILENAME  $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT    $realpath_root;
    fastcgi_param SERVER_PORT      $http_x_forwarded_port;
}
